<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報確認 | Sapporo Gourmet Radar</title><style>body{margin:0;background:#f5f6f2;color:#20372c;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}a{color:#246647}h1{font-size:30px}button,input,select{font:inherit;padding:10px;border:1px solid #ccd7cc;border-radius:8px;background:white}button{cursor:pointer}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.card{padding:22px;background:white;border:1px solid #dde4db;border-radius:12px;margin:14px 0}.meta{color:#657166;font-size:14px}.error{color:#a53030}textarea{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:10px;font:inherit}h2{font-size:19px}#summary{padding:20px;background:#e4eee5;border-radius:12px}</style><main><a href="./">← 公開サイト</a><h1>収集情報の確認</h1><p>掲載データ・SNS参考ランキング・新商品・期間限定品・未確認候補・収集失敗を確認できます。出典を開いて日付と内容を照合してください。</p><p class="meta">この画面は公開されています。確認状態とメモはこのブラウザだけに保存され、公開情報には反映されません。個人情報や秘密情報は入力しないでください。</p><p><a href="survey.html">インフルエンサー向けアンケート</a> · 回答は業務用Gmailで確認（この公開画面には保存しません）。</p><div id="summary">読み込み中…</div><div class="bar"><select id="mode" aria-label="確認対象"><option value="published">掲載データ</option><option value="popular">SNS参考ランキング・取材候補</option><option value="products">新商品・期間限定品</option><option value="pending">未確認候補</option><option value="sources">収集状況</option></select><input id="query" placeholder="名称・出典・理由で検索" aria-label="検索"><select id="filter" aria-label="確認状態"><option value="all">すべての確認状態</option><option value="未確認">未確認</option><option value="確認済み">確認済み</option><option value="要修正">要修正</option><option value="対象外">対象外</option></select><button id="refresh">最新情報を取得</button><button id="export">確認記録を出力</button></div><p id="count"></p><div id="list"></div></main><script>
let news={},pending={},report={},popular={},products={},notes={};try{notes=JSON.parse(localStorage.getItem('radar-review-v1')||'{}')}catch{}
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?'<a target="_blank" rel="noopener" href="'+esc(x.href)+'">出典を開く ↗</a>':''}catch{return ''}}
function key(r){let mode=$('mode').value;return ['popular','products'].includes(mode)?mode+':'+String(r.id):r.url||r.source||String(r.id)}
function save(k,field,v){notes[k]={...notes[k],[field]:v};try{localStorage.setItem('radar-review-v1',JSON.stringify(notes))}catch{$('summary').textContent='確認記録を保存できません。出力ボタンで記録を保存してください。'}}
function render(){let mode=$('mode').value,items=mode==='published'?news.items||[]:mode==='pending'?pending.items||[]:mode==='popular'?popular.items||[]:mode==='products'?products.items||[]:report.sources||[];let q=$('query').value.toLowerCase();items=items.filter(r=>JSON.stringify(r).toLowerCase().includes(q)&&($('filter').value==='all'||(notes[key(r)]?.status||'未確認')===$('filter').value));$('count').textContent=items.length+'件';$('list').innerHTML=items.map((r,i)=>{let n=notes[key(r)]||{};return '<article class="card"><h2>'+esc(r.name||r.source||r.url)+'</h2><p>'+esc(r.type||r.kind||r.category||'')+' '+esc(r.date||r.start||'')+(r.end?' ～ '+esc(r.end):'')+' '+esc(r.place||r.stores||r.area||'')+'</p><p class="meta">'+esc(r.source||'')+' · '+esc(r.reason||r.error||r.text||r.evidence||r.description||(r.ok===true?'取得成功':r.ok===false?'取得失敗':''))+'</p>'+(mode==='popular'&&Number.isFinite(r.sns_views)?'<p>SNS掲載視聴数 '+r.sns_views.toLocaleString('ja-JP')+'回 · 確認日 '+esc(r.metric_checked_at)+'</p>':'')+(mode==='products'?'<p>'+esc(r.price)+' · '+(r.limited?'期間限定':'終了日未公表')+' · 確認日 '+esc(r.checked_at||products.checked_at)+'</p>':'')+link(r.metric_url||r.url)+'<p>確認状態 <select data-row="'+i+'">'+['未確認','確認済み','要修正','対象外'].map(s=>'<option'+(s===(n.status||'未確認')?' selected':'')+'>'+s+'</option>').join('')+'</select></p><textarea data-row="'+i+'" placeholder="確認メモ" aria-label="確認メモ">'+esc(n.memo||'')+'</textarea></article>'}).join('')||'<p>該当する情報はありません。</p>';$('list').querySelectorAll('select').forEach(e=>e.onchange=()=>save(key(items[+e.dataset.row]),'status',e.value));$('list').querySelectorAll('textarea').forEach(e=>e.oninput=()=>save(key(items[+e.dataset.row]),'memo',e.value))}
async function load(){try{let values=await Promise.all(['news.json','unconfirmed.json','collection-report.json','popular.json','products.json'].map(async p=>{let r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' の読込失敗');return r.json()}));[news,pending,report,popular,products]=values;$('summary').textContent='最終収集：'+(news.last_run||'未取得')+' ｜掲載データ '+(news.items||[]).length+'件 ｜話題店 '+(popular.items||[]).length+'店 ｜商品 '+(products.items||[]).length+'件 ｜未確認候補 '+(pending.items||[]).length+'件 ｜収集元 '+(report.successful_sources??0)+' / '+(report.sources||[]).length+' 成功';render()}catch(e){$('summary').textContent='読み込みに失敗しました：'+e.message;$('summary').className='error'}}
['mode','query','filter'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=load;$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({exported_at:new Date().toISOString(),reviews:notes},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='radar-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};load();
</script></html>
