<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報の訂正・ご意見 | さっぽろグルメ先どり</title><link rel="stylesheet" href="editorial.css?v=20261011-map"><style>main{max-width:760px;margin:auto;padding:36px 20px}label{display:block;margin:24px 0}input,select,textarea,button{font:inherit}textarea,input,select{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #ccd5ca;background:white}textarea{min-height:150px}button{padding:14px 20px;cursor:pointer;margin:8px 10px 8px 0}p{line-height:1.8}.small{font-size:13px}</style></head><body><main><a href="./">← グルメ情報へ戻る</a><p class="eyebrow">YOUR SAPPORO FOOD GUIDE</p><h1>情報の訂正・ご意見</h1><p>「さっぽろグルメ先どり」は、札幌市内のお店や食のイベントを探せる<strong>無料・登録不要</strong>のサイトです。掲載内容の訂正、掲載してほしい情報、使いにくいところなどをお知らせください。</p><form id="feedback"><label>ご連絡の種類<select name="kind"><option>掲載情報の訂正</option><option>お店・イベントの情報提供</option><option>サイトの使い方・改善のご意見</option><option>その他</option></select></label><label>内容（必須）<textarea name="message" required maxlength="2000" placeholder="店名、該当ページ、訂正内容などをお書きください。"></textarea></label><label>参考ページのURL（任意）<input name="source" type="url" maxlength="600" placeholder="https://"></label><p class="small">「メールで連絡する」を押すとメールアプリが開きます。ご自身で送信すると開発担当へ届きます。ここで送信ボタンを押すだけでは自動送信されません。内容をコピーしてメールやInstagramのメッセージで伝えることもできます。ご連絡内容や連絡先をそのまま公開することはありません。</p><button class="primary" type="submit">メールで連絡する</button><button type="button" id="copy">連絡文をコピー</button><p id="status" role="status"></p><textarea id="answer" aria-label="連絡文" readonly hidden></textarea></form><p><a href="https://www.instagram.com/sapporo.gourmet.radar/" target="_blank" rel="noopener">Instagramを見る ↗</a></p></main><script>
const form=document.getElementById('feedback');function answer(){let f=new FormData(form);return 'さっぽろグルメ先どりへの連絡\n\n種類：'+f.get('kind')+'\n\n'+f.get('message')+'\n\n参考URL：'+(f.get('source')||'なし')}
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;location.href='mailto:yasu.susukino@gmail.com?subject='+encodeURIComponent('【さっぽろグルメ先どり】情報の訂正・ご意見')+'&body='+encodeURIComponent(answer());document.getElementById('status').textContent='メールアプリで内容を確認して送信してください。'});
document.getElementById('copy').onclick=async()=>{if(!form.reportValidity())return;let a=document.getElementById('answer');a.hidden=false;a.value=answer();try{await navigator.clipboard.writeText(a.value);document.getElementById('status').textContent='連絡文をコピーしました。'}catch{a.select();document.getElementById('status').textContent='連絡文を選択しました。コピーしてください。'}};
</script></body></html>
