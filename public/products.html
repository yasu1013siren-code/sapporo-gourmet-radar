<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新商品・期間限定品 | Sapporo Gourmet Radar</title><style>body{margin:0;background:#f5f4ee;color:#172a28;font:16px system-ui}main{max-width:1050px;margin:auto;padding:32px 20px}a{color:#126955}h1{font-size:32px}p{line-height:1.8}.small{font-size:13px;color:#62716a}.card{background:white;padding:24px;margin:18px 0;border:1px solid #dce2d8;border-radius:12px}.tag{background:#e5f0e7;padding:6px 10px;border-radius:5px;font-size:13px}.links{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}input,button,select{padding:12px;font:inherit;border:1px solid #cad6cb;border-radius:7px;background:white}.filter{display:flex;gap:12px;flex-wrap:wrap}#info{padding:20px;background:#e5ece2;border-radius:12px}.urgent{background:#fff1dc;color:#895400;padding:10px;border-radius:6px}nav{display:flex;gap:24px;flex-wrap:wrap}h2{font-size:24px}</style><link rel="stylesheet" href="editorial.css?v=20261011-photo"><style>main{padding-top:32px}.card{display:block}.card h2{font-family:serif}.card p{margin:12px 0}.card{border-radius:0;background:transparent}nav{margin-bottom:30px}h1{font-size:34px}</style><main><nav><a href="./">← 開店・イベント</a><a href="popular.html">総合・カテゴリ別ランキング</a></nav><h1>新商品・期間限定品</h1><p>発売予定から季節限定メニューまで、札幌と周辺の取材ネタを探す。</p><div id="info">読み込み中…</div><p class="small">発売・販売開始が前後1か月のものと、現在販売期間中の期間限定品を表示。終了した商品は非表示です。販売期間内でも完売・休業の場合があります。新規商品の自動追加は未対応です。</p><div class="filter"><input id="q" aria-label="商品検索" placeholder="商品名・店舗で探す"><select id="kind" aria-label="商品種別"><option value="">すべて</option><option value="new">新商品</option><option value="limited">期間限定品</option></select><select id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option><option>スイーツ</option><option>パン</option><option>飲料・食品</option></select><select id="area" aria-label="エリア"><option value="">すべてのエリア</option><option>札幌中心部</option><option>札幌市内・周辺</option><option>新千歳空港</option></select><select id="order" aria-label="並べ方"><option value="end">終了が近い順</option><option value="start">発売・販売開始が新しい順</option></select></div><p id="count"></p><div id="list"></div></main><script>
let items=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date())}
function day(d){return Date.parse(d+'T00:00:00+09:00')}
function delta(d){return Math.round((day(d)-day(today()))/86400000)}
function monthShift(d,n){let [y,m,k]=d.split('-').map(Number),dt=new Date(Date.UTC(y,m-1+n,1)),last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();dt.setUTCDate(Math.min(k,last));return dt.toISOString().slice(0,10)}
function visible(r){let t=today();return (!r.end||r.end>=t)&&r.start<=monthShift(t,1)&&(r.start>=monthShift(t,-1)||(r.limited&&r.end>=t))}
function filtered(){let q=$('q').value.toLowerCase();return items.filter(r=>visible(r)&&[r.name,r.brand,r.stores].join(' ').toLowerCase().includes(q)&&(!$('category').value||r.category===$('category').value)&&(!$('area').value||r.area===$('area').value)&&(!$('kind').value||($('kind').value==='limited'?r.limited:r.kind==='新商品'))).sort((a,b)=>$('order').value==='end'?(a.end||'9999').localeCompare(b.end||'9999')||b.start.localeCompare(a.start):b.start.localeCompare(a.start))}
function link(url,label){try{let u=new URL(url);if(u.protocol!=='https:')return '';return '<a target="_blank" rel="noopener" href="'+esc(u.href)+'">'+esc(label)+' ↗</a>'}catch{return ''}}
function countdown(r){let n=delta(r.start);if(n>0)return '販売開始まであと'+n+'日';if(n===0)return '本日販売開始'+(r.end?' · 終了まであと'+delta(r.end)+'日':'');if(r.end)return delta(r.end)===0?'本日販売最終日':'販売期間中 · 終了まであと'+delta(r.end)+'日';return '発売済み · 終了日未公表'}
function render(){let rows=filtered();$('count').textContent=rows.length+'件を表示';$('list').innerHTML=rows.map(r=>'<article class="card"><span class="tag">'+esc(r.kind)+'</span><h2>'+esc(r.name)+'</h2><p class="small">'+esc(r.brand)+' · '+esc(r.category)+' · '+esc(r.area)+'</p><p class="urgent">'+esc(countdown(r))+'</p><p>販売開始 '+esc(r.start)+' ／ 終了 '+esc(r.end||'未公表')+'</p><p><b>'+esc(r.price)+'</b></p><p>'+esc(r.description)+'</p><p><b>販売店舗：</b>'+esc(r.stores)+'</p>'+(r.note?'<p class="small">'+esc(r.note)+'</p>':'')+'<div class="links">'+link(r.url,'公式発表・販売条件')+link(r.website_url,'公式サイト')+(r.phone&&/^\d{10,11}$/.test(r.phone)?'<a href="tel:'+r.phone+'">電話で確認</a>':'')+(r.email&&/^[\w.+-]+@[\w.-]+$/.test(r.email)?'<a href="mailto:'+esc(r.email)+'">取材問い合わせ</a>':'')+'</div><p class="small">'+esc(r.source)+' · 情報確認日 '+esc(r.checked_at)+'</p></article>').join('')||'<p>該当する商品はありません。</p>'}
['q','kind','category','area','order'].forEach(id=>$(id).oninput=render);
fetch('products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(n=>{items=(n.items||[]).map(r=>({...r,checked_at:r.checked_at||n.checked_at}));$('info').textContent='公式情報で確認した商品 '+items.length+'件 · 確認日 '+n.checked_at;render()}).catch(()=>{$('info').textContent='情報を読み込めませんでした。再読み込みしてください。'});
</script></html>
