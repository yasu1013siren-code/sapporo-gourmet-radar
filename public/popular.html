<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>話題の店を探す | Sapporo Gourmet Radar</title><style>body{margin:0;background:#f5f4ee;color:#172a28;font:16px system-ui}main{max-width:1050px;margin:auto;padding:32px 20px}a{color:#126955}h1{font-size:32px}p{line-height:1.8}.small{font-size:13px;color:#62716a}.card{background:white;padding:24px;margin:18px 0;border:1px solid #dce2d8;border-radius:12px}.tag{background:#e5f0e7;padding:6px 10px;border-radius:5px;font-size:13px}.links{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}input,button,select{padding:12px;font:inherit;border:1px solid #cad6cb;border-radius:7px;background:white}.filter{display:flex;gap:12px;flex-wrap:wrap}#info{padding:20px;background:#e5ece2;border-radius:12px}</style><main><a href="./">← 新店・グルメイベントへ</a><h1>話題の店を探す</h1><p>SNSの紹介、店舗が公表する行列や販売実績から、取材候補を探せます。</p><div id="info">掲載準備中…</div><p class="small">順位を付けず、情報源と確認日を表示します。SNS集計・販売実績・検索傾向は別の指標です。Google Trendsは相対的な関心を確認する外部サービスで、検索回数を示すものではありません。</p><div class="filter"><input id="q" placeholder="店名・業態で検索" aria-label="話題店を検索"><select id="category" aria-label="業態"><option value="">すべての業態</option><option>スイーツ</option><option>カフェ</option><option>パン</option><option>ラーメン</option><option>カレー</option></select><select id="area" aria-label="エリア"><option value="">すべてのエリア</option><option>札幌中心部</option><option>札幌市内・周辺</option></select><button id="compare">絞り込んだ候補の先頭5店を比較</button></div><p id="count" class="small"></p><div id="list"></div></main><script>
let items=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(url,label){try{let u=new URL(url);if(u.protocol!=='https:')return '';return '<a href="'+esc(u.href)+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>'}catch{return ''}}
function render(){let q=$('q').value.toLowerCase(),rows=items.filter(r=>[r.name,r.genre,r.signal].join(' ').toLowerCase().includes(q)&&(!$('category').value||r.category===$('category').value)&&(!$('area').value||r.area===$('area').value));$('count').textContent=rows.length+'店を表示';$('list').innerHTML=rows.map(r=>'<article class="card"><span class="tag">'+esc(r.signal)+'</span><h2>'+esc(r.name)+'</h2><p class="small">'+esc(r.area)+' · '+esc(r.genre)+'</p><p>'+esc(r.evidence)+'</p>'+(r.angle?'<p><b>取材の切り口：</b>'+esc(r.angle)+'</p>':'')+(r.campaign?'<p><b>今の取材の切り口：</b>'+esc(r.campaign)+'</p>':'')+'<p class="small">根拠の確認日 '+esc(r.signal_date)+' · '+esc(r.source)+'</p><div class="links">'+link(r.url,'話題の根拠を見る')+link(r.website_url,'店舗公式')+link(r.social_url,'公式Instagram')+link('https://www.instagram.com/explore/search/keyword/?q='+encodeURIComponent(r.keyword),'Instagramで探す')+link('https://x.com/search?q='+encodeURIComponent(r.keyword)+'&f=live','Xの最新投稿を探す')+link('https://trends.google.com/trends/explore?date=today%203-m&geo=JP-01&q='+encodeURIComponent(r.keyword),'北海道の検索傾向')+'</div></article>').join('')||'<p>該当する店舗はありません。</p>'}
['q','category','area'].forEach(id=>$(id).oninput=render);$('compare').onclick=()=>window.open('https://trends.google.com/trends/explore?date=today%203-m&geo=JP-01&q='+items.filter(r=>(!$('category').value||r.category===$('category').value)&&(!$('area').value||r.area===$('area').value)).slice(0,5).map(r=>encodeURIComponent(r.keyword)).join(','),'_blank','noopener');
fetch('popular.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(n=>{items=n.items||[];$('info').textContent='確認した取材候補 '+items.length+'店 · 確認日 '+n.checked_at+'。SNS紹介は第三者の集計、販売実績は店舗公表の内容です。';render()}).catch(()=>{$('info').textContent='情報を読み込めませんでした。再読み込みしてください。'});
</script></html>
