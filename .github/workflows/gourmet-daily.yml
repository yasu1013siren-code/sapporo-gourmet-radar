name: Gourmet Radar daily update
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gourmet-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect public information
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Save collected data
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news.json collection-report.json unconfirmed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Gourmet Radar data'
            git push
          fi
      - name: Prepare independent site
        run: |
          mkdir -p _site
          cp public/* _site/
          cp unconfirmed.json collection-report.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
